<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Trabalhe Conosco</title>
</head>
<body>
    
    <h1>Trabalhe Conosco</h1>

    <form action="/enviar-curriculo" method="POST">

        <label for="name">Nome:</label>
        <input type="text" id="name" name="nome" required placeholder="Digite seu nome">

        <label for="surname">Sobrenome:</label>
        <input type="text" id="surname" name="surname" required placeholder="Digite seu sobrenome">

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="Digite seu E-mail">

        <label for="phone">Telefone/WhatsApp:</label>
        <input type="tel" id="phone" name="phone" required placeholder="Digite seu telefone/WhatsApp">

        <label for="address">Endereço:</label>
        <input type="text" id="address" name="address" required placeholder="Digite seu endereço completo">

        <label for="vaga">Vaga Desejada:</label>
        <select id="vaga" name="vaga" required>
            <option value="">Selecione uma vaga</option>
            <option value="operador">Operador de Caixa</option>
            <option value="atendente">Atendente de Loja</option>
            <option value="auxiliar">Auxiliar Administrativo</option>
            <option value="padeiro">Padeiro</option>
        </select>

        <label for="resume">Histórico Profissional:</label>
        <textarea name="resume" id="resume" placeholder="Escreva seu resumo profissional"></textarea>

        <label for="curriculum">Currículo:</label>
        <input type="file" id="curriculum" name="curriculum" accept=".pdf,.doc,.docx">

        <button type="submit">Enviar Currículo</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
